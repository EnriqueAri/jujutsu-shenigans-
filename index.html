<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Arena - Multiplayer</title>
    <style>
        body { margin: 0; background: #0f0c1b; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #menu { background: rgba(20, 16, 36, 0.95); border: 2px solid #6b11ff; border-radius: 12px; padding: 30px; width: 350px; text-align: center; box-shadow: 0 0 30px rgba(107, 17, 255, 0.4); z-index: 10; }
        h1 { font-size: 2.2rem; margin-bottom: 20px; color: #a16eff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(161, 110, 255, 0.5); }
        input { width: 90%; padding: 12px; margin: 10px 0; background: #1a1530; border: 1px solid #4a3b75; border-radius: 6px; color: #fff; font-size: 1rem; text-align: center; }
        input:focus { border-color: #a16eff; outline: none; }
        button { width: 97%; padding: 14px; margin-top: 15px; background: linear-gradient(45deg, #6b11ff, #a16eff); border: none; border-radius: 6px; color: #fff; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(107, 17, 255, 0.4); }
        #arena { display: none; position: absolute; width: 100vw; height: 100vh; background: radial-gradient(circle, #251c4a 0%, #0d0822 100%); }
        .player { position: absolute; width: 40px; height: 40px; background: #00ffcc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; box-shadow: 0 0 15px #00ffcc; transition: top 0.1s, left 0.1s; color: #000; }
        .player.remote { background: #ff0055; box-shadow: 0 0 15px #ff0055; color: #fff; }
        .name-tag { position: absolute; top: -25px; background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; white-space: nowrap; color: #fff; }
    </style>
</head>
<body>

    <div id="menu">
        <h1>⚡ CURSED TOKYO </h1>
        <p style="color: #8c82b0; font-size: 0.9rem; margin-top: -15px; margin-bottom: 25px;">JJK-Inspired Realtime Arena</p>
        <input type="text" id="username" placeholder="Enter Your Name" value="Sorcerer">
        <input type="text" id="lobbyId" placeholder="Lobby Code (Leave blank to create)">
        <button id="joinBtn">Enter Arena</button>
    </div>

    <div id="arena"></div>

    <!-- Include a highly reliable public server messaging script automatically -->
    <script src="https://unpkg.com"></script>
    <script>
        const menu = document.getElementById('menu');
        const arena = document.getElementById('arena');
        const usernameInput = document.getElementById('username');
        const lobbyInput = document.getElementById('lobbyId');
        const joinBtn = document.getElementById('joinBtn');

        let peer = null;
        let connections = [];
        let myId = '';
        let myName = 'Sorcerer';
        let myPos = { x: Math.random() * 500 + 100, y: Math.random() * 500 + 100 };
        let remotePlayers = {};

        joinBtn.addEventListener('click', () => {
            myName = usernameInput.value.trim() || 'Sorcerer';
            const targetLobby = lobbyInput.value.trim();

            // Connects instantly to the free public cloud communications relay
            peer = new Peer(targetLobby ? null : 'jjk-lobby-' + Math.floor(Math.random() * 90000 + 10000));

            peer.on('open', (id) => {
                myId = id;
                menu.style.display = 'none';
                arena.style.display = 'block';

                if (!targetLobby) {
                    // Host Mode
                    alert(`Lobby Created! Tell your friend to enter this code: ${id}`);
                    spawnPlayer(myId, myName, myPos.x, myPos.y, false);
                } else {
                    // Client Join Mode
                    const conn = peer.connect(targetLobby);
                    setupConnection(conn);
                }
            });

            peer.on('connection', (conn) => {
                setupConnection(conn);
            });
        });

        function setupConnection(conn) {
            connections.push(conn);
            conn.on('open', () => {
                // Send our initial handshake payload
                conn.send({ type: 'join', id: myId, name: myName, x: myPos.x, y: myPos.y });
                spawnPlayer(myId, myName, myPos.x, myPos.y, false);
            });

            conn.on('data', (data) => {
                if (data.type === 'join') {
                    spawnPlayer(data.id, data.name, data.x, data.y, true);
                    // Reply back so they map us too
                    conn.send({ type: 'reply', id: myId, name: myName, x: myPos.x, y: myPos.y });
                } else if (data.type === 'reply') {
                    spawnPlayer(data.id, data.name, data.x, data.y, true);
                } else if (data.type === 'move') {
                    updateRemotePosition(data.id, data.x, data.y);
                }
            });
        }

        function spawnPlayer(id, name, x, y, isRemote) {
            if (document.getElementById(id)) return;
            const p = document.createElement('div');
            p.id = id;
            p.className = `player ${isRemote ? 'remote' : ''}`;
            p.style.left = `${x}px`;
            p.style.top = `${y}px`;
            p.innerText = name.substring(0, 2).toUpperCase();

            const tag = document.createElement('div');
            tag.className = 'name-tag';
            tag.innerText = name;
            p.appendChild(tag);

            arena.appendChild(p);
            if (isRemote) remotePlayers[id] = p;
        }

        function updateRemotePosition(id, x, y) {
            const p = document.getElementById(id);
            if (p) {
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
            }
        }

        // Standard Keyboard Movement Controls
        window.addEventListener('keydown', (e) => {
            if (arena.style.display !== 'block') return;
            const speed = 15;
            if (e.key === 'ArrowUp' || e.key === 'w') myPos.y -= speed;
            if (e.key === 'ArrowDown' || e.key === 's') myPos.y += speed;
            if (e.key === 'ArrowLeft' || e.key === 'a') myPos.x -= speed;
            if (e.key === 'ArrowRight' || e.key === 'd') myPos.x += speed;

            const myEl = document.getElementById(myId);
            if (myEl) {
                myEl.style.left = `${myPos.x}px`;
                myEl.style.top = `${myPos.y}px`;
            }

            // Sync with everyone instantly over the network mesh
            connections.forEach(conn => {
                if (conn.open) conn.send({ type: 'move', id: myId, x: myPos.x, y: myPos.y });
            });
        });
    </script>
</body>
</html>
